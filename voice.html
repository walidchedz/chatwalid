<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكالمة صوتية - دردشتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
        
        * {
            font-family: 'Tajawal', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .call-container {
            height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .caller-avatar {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
            animation: pulse 2s infinite;
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.4);
        }
        
        .caller-avatar::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: ripple 2s infinite;
        }
        
        .caller-avatar::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: ripple 3s infinite 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .call-timer {
            font-size: 2.5rem;
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .call-status {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.3rem;
            margin-bottom: 50px;
            font-weight: 500;
        }
        
        .caller-name {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .audio-waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 40px 0;
            height: 80px;
        }
        
        .wave-bar {
            width: 8px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 4px;
            animation: wave 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { animation-delay: 0.4s; }
        .wave-bar:nth-child(8) { animation-delay: 0.3s; }
        .wave-bar:nth-child(9) { animation-delay: 0.2s; }
        .wave-bar:nth-child(10) { animation-delay: 0.1s; }
        .wave-bar:nth-child(11) { animation-delay: 0.2s; }
        .wave-bar:nth-child(12) { animation-delay: 0.3s; }
        
        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 60px; }
        }
        
        .call-controls {
            display: flex;
            gap: 25px;
            margin-top: 50px;
        }
        
        .control-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .control-button::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            opacity: 0.3;
            transform: scale(0);
            transition: transform 0.3s ease;
        }
        
        .control-button:active::before {
            transform: scale(1.2);
        }
        
        .control-button:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }
        
        .control-button.end-call {
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }
        
        .control-button.mute {
            background: linear-gradient(45deg, #6b7280, #4b5563);
        }
        
        .control-button.mute.active {
            background: linear-gradient(45deg, #f59e0b, #d97706);
        }
        
        .control-button.speaker {
            background: linear-gradient(45deg, #10b981, #059669);
        }
        
        .control-button.speaker.active {
            background: linear-gradient(45deg, #3b82f6, #2563eb);
        }
        
        .control-button.hold {
            background: linear-gradient(45deg, #8b5cf6, #7c3aed);
        }
        
        .control-button.hold.active {
            background: linear-gradient(45deg, #f59e0b, #d97706);
        }
        
        .call-info {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .call-quality {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }
        
        .quality-indicator {
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }
        
        .volume-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .incoming-call {
            display: none;
            text-align: center;
        }
        
        .incoming-call .caller-avatar {
            animation: ring 1s infinite;
        }
        
        @keyframes ring {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .accept-decline {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }
        
        .accept-button {
            background: linear-gradient(45deg, #10b981, #059669);
        }
        
        .decline-button {
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }
        
        .call-duration {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 15px;
        }
        
        .volume-slider {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .volume-bar {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            position: relative;
        }
        
        .volume-level {
            height: 100%;
            background: linear-gradient(45deg, #10b981, #059669);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        .call-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .action-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .action-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-effect fixed top-0 left-0 right-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-comments text-white text-lg"></i>
                </div>
                <h1 class="text-white text-xl font-bold">دردشتي</h1>
            </div>
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-white hover:text-yellow-300 transition-colors font-medium">الرئيسية</a>
                <a href="chat.html" class="text-white hover:text-yellow-300 transition-colors font-medium">دردشة</a>
                <a href="voice.html" class="text-yellow-300 font-medium">صوت</a>
                <a href="video.html" class="text-white hover:text-yellow-300 transition-colors font-medium">فيديو</a>
            </div>
        </div>
    </nav>

    <!-- Volume Indicator -->
    <div class="volume-indicator" id="volumeIndicator">
        <i class="fas fa-microphone ml-2"></i>
        <span id="volumeLevel">85%</span>
    </div>

    <!-- Volume Slider -->
    <div class="volume-slider" id="volumeSlider">
        <div class="volume-bar">
            <div class="volume-level" id="volumeLevelBar" style="width: 85%;"></div>
        </div>
    </div>

    <!-- Call Actions -->
    <div class="call-actions">
        <button class="action-button" onclick="showVolumeSlider()" title="مستوى الصوت">
            <i class="fas fa-volume-up"></i>
        </button>
        <button class="action-button" onclick="showMoreOptions()" title="المزيد">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </div>

    <!-- Call Container -->
    <div class="call-container mx-6">
        <!-- Incoming Call Screen -->
        <div class="incoming-call" id="incomingCall">
            <div class="caller-avatar">
                <i class="fas fa-user text-white text-4xl"></i>
            </div>
            <h2 class="caller-name">أحمد محمد</h2>
            <p class="call-status">مكالمة صوتية واردة...</p>
            <div class="accept-decline">
                <button class="control-button accept-button" onclick="acceptCall()">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="control-button decline-button" onclick="declineCall()">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>

        <!-- Active Call Screen -->
        <div class="active-call" id="activeCall">
            <div class="call-info">
                <div class="caller-avatar">
                    <i class="fas fa-user text-white text-4xl"></i>
                </div>
                <h2 class="caller-name">أحمد محمد</h2>
                <div class="call-timer" id="callTimer">00:00</div>
                <div class="call-duration" id="callDuration">مكالمة صوتية نشطة</div>
                <div class="call-quality">
                    <div class="quality-indicator"></div>
                    <span>جودة ممتازة</span>
                </div>
            </div>

            <!-- Audio Waves -->
            <div class="audio-waves" id="audioWaves">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <!-- Call Controls -->
            <div class="call-controls">
                <button class="control-button mute" id="muteButton" onclick="toggleMute()" title="كتم الصوت">
                    <i class="fas fa-microphone" id="muteIcon"></i>
                </button>
                <button class="control-button speaker" id="speakerButton" onclick="toggleSpeaker()" title="مكبر الصوت">
                    <i class="fas fa-volume-up" id="speakerIcon"></i>
                </button>
                <button class="control-button hold" id="holdButton" onclick="toggleHold()" title="الإبقاء">
                    <i class="fas fa-pause" id="holdIcon"></i>
                </button>
                <button class="control-button end-call" onclick="endCall()" title="إنهاء المكالمة">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let callStartTime = null;
        let callTimer = null;
        let isMuted = false;
        let isSpeaker = false;
        let isOnHold = false;
        let isCallActive = false;
        let currentVolume = 85;
        
        // Initialize call
        document.addEventListener('DOMContentLoaded', function() {
            // Simulate incoming call after 2 seconds
            setTimeout(() => {
                showIncomingCall();
            }, 2000);
        });
        
        // Show incoming call
        function showIncomingCall() {
            document.getElementById('incomingCall').style.display = 'block';
            document.getElementById('activeCall').style.display = 'none';
            
            // Auto-accept after 5 seconds (demo)
            setTimeout(() => {
                if (!isCallActive) {
                    acceptCall();
                }
            }, 5000);
        }
        
        // Accept call
        function acceptCall() {
            isCallActive = true;
            document.getElementById('incomingCall').style.display = 'none';
            document.getElementById('activeCall').style.display = 'block';
            
            // Start call timer
            callStartTime = new Date();
            startCallTimer();
            
            // Show volume indicator
            showVolumeIndicator();
            
            // Animate controls
            anime({
                targets: '.control-button',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 600,
                delay: anime.stagger(100),
                easing: 'easeOutElastic(1, .8)'
            });
            
            // Animate audio waves
            anime({
                targets: '.wave-bar',
                scaleY: [0, 1],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(50),
                easing: 'easeOutElastic(1, .8)'
            });
            
            showNotification('تم بدء المكالمة بنجاح!', 'success');
        }
        
        // Decline call
        function declineCall() {
            window.location.href = 'chat.html';
        }
        
        // Start call timer
        function startCallTimer() {
            callTimer = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                
                document.getElementById('callTimer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // Show volume indicator
        function showVolumeIndicator() {
            const volumeIndicator = document.getElementById('volumeIndicator');
            volumeIndicator.style.display = 'block';
            
            // Simulate volume changes
            setInterval(() => {
                const volume = Math.floor(Math.random() * 30) + 70;
                currentVolume = volume;
                document.getElementById('volumeLevel').textContent = volume + '%';
                
                // Update volume bar
                const volumeBar = document.getElementById('volumeLevelBar');
                if (volumeBar) {
                    volumeBar.style.width = volume + '%';
                }
            }, 2000);
        }
        
        // Show volume slider
        function showVolumeSlider() {
            const slider = document.getElementById('volumeSlider');
            slider.style.display = slider.style.display === 'block' ? 'none' : 'block';
            
            if (slider.style.display === 'block') {
                // Animate slider
                anime({
                    targets: slider,
                    scale: [0.8, 1],
                    opacity: [0, 1],
                    duration: 200,
                    easing: 'easeOutBack'
                });
                
                // Hide after 5 seconds
                setTimeout(() => {
                    slider.style.display = 'none';
                }, 5000);
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            const button = document.getElementById('muteButton');
            const icon = document.getElementById('muteIcon');
            
            if (isMuted) {
                button.classList.add('active');
                icon.className = 'fas fa-microphone-slash';
                button.style.background = 'linear-gradient(45deg, #f59e0b, #d97706)';
                showNotification('تم كتم الميكروفون', 'warning');
            } else {
                button.classList.remove('active');
                icon.className = 'fas fa-microphone';
                button.style.background = 'linear-gradient(45deg, #6b7280, #4b5563)';
                showNotification('تم إلغاء كتم الميكروفون', 'info');
            }
            
            // Animate button
            animateButton(button);
        }
        
        // Toggle speaker
        function toggleSpeaker() {
            isSpeaker = !isSpeaker;
            const button = document.getElementById('speakerButton');
            const icon = document.getElementById('speakerIcon');
            
            if (isSpeaker) {
                button.classList.add('active');
                icon.className = 'fas fa-volume-up';
                button.style.background = 'linear-gradient(45deg, #3b82f6, #2563eb)';
                showNotification('تم تفعيل مكبر الصوت', 'info');
            } else {
                button.classList.remove('active');
                icon.className = 'fas fa-volume-down';
                button.style.background = 'linear-gradient(45deg, #10b981, #059669)';
                showNotification('تم إلغاء تفعيل مكبر الصوت', 'info');
            }
            
            // Animate button
            animateButton(button);
        }
        
        // Toggle hold
        function toggleHold() {
            isOnHold = !isOnHold;
            const button = document.getElementById('holdButton');
            const icon = document.getElementById('holdIcon');
            const status = document.querySelector('.call-status');
            const waves = document.getElementById('audioWaves');
            
            if (isOnHold) {
                button.classList.add('active');
                icon.className = 'fas fa-play';
                button.style.background = 'linear-gradient(45deg, #f59e0b, #d97706)';
                status.textContent = 'المكالمة معلقة';
                waves.style.opacity = '0.3';
                waves.style.animationPlayState = 'paused';
                showNotification('تم وضع المكالمة على الإبقاء', 'warning');
            } else {
                button.classList.remove('active');
                icon.className = 'fas fa-pause';
                button.style.background = 'linear-gradient(45deg, #8b5cf6, #7c3aed)';
                status.textContent = 'مكالمة صوتية نشطة';
                waves.style.opacity = '1';
                waves.style.animationPlayState = 'running';
                showNotification('تم استئناف المكالمة', 'success');
            }
            
            // Animate button
            animateButton(button);
        }
        
        // End call
        function endCall() {
            // Clear timer
            if (callTimer) {
                clearInterval(callTimer);
            }
            
            // Animate end call
            anime({
                targets: '.active-call',
                scale: [1, 0.8],
                opacity: [1, 0],
                duration: 600,
                easing: 'easeInQuad',
                complete: () => {
                    showCallEnded();
                }
            });
        }
        
        // Show call ended
        function showCallEnded() {
            const callContainer = document.querySelector('.call-container');
            const duration = document.getElementById('callTimer').textContent;
            
            callContainer.innerHTML = `
                <div class="text-center">
                    <div class="caller-avatar" style="background: linear-gradient(45deg, #6b7280, #4b5563);">
                        <i class="fas fa-phone-slash text-white text-4xl"></i>
                    </div>
                    <h2 class="caller-name">تم إنهاء المكالمة</h2>
                    <p class="call-duration">مدة المكالمة: ${duration}</p>
                    <div class="mt-8 flex gap-6 justify-center">
                        <button class="control-button" onclick="window.location.href='chat.html'" style="background: linear-gradient(45deg, #667eea, #764ba2); width: 80px; height: 80px;">
                            <i class="fas fa-comment text-2xl"></i>
                        </button>
                        <button class="control-button" onclick="window.location.href='video.html'" style="background: linear-gradient(45deg, #8b5cf6, #7c3aed); width: 80px; height: 80px;">
                            <i class="fas fa-video text-2xl"></i>
                        </button>
                    </div>
                </div>
            `;
            
            // Animate new content
            anime({
                targets: '.call-container > div',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 600,
                easing: 'easeOutQuad'
            });
            
            showNotification('تم إنهاء المكالمة', 'info');
        }
        
        // Show more options
        function showMoreOptions() {
            const options = [
                'إضافة مشارك للمكالمة',
                'تسجيل المكالمة',
                'الإعدادات',
                'مشاركة الموقع',
                'إرسال رسالة نصية'
            ];
            
            const randomOption = options[Math.floor(Math.random() * options.length)];
            showNotification(`${randomOption} - قريباً!`, 'info');
        }
        
        // Animate button
        function animateButton(button) {
            anime({
                targets: button,
                scale: [1, 1.2, 1],
                duration: 300,
                easing: 'easeOutElastic(1, .8)'
            });
        }
        
        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full text-white font-medium shadow-lg`;
            
            switch(type) {
                case 'success':
                    notification.className += ' bg-green-500';
                    break;
                case 'warning':
                    notification.className += ' bg-yellow-500';
                    break;
                case 'error':
                    notification.className += ' bg-red-500';
                    break;
                default:
                    notification.className += ' bg-blue-500';
            }
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Animate notification
            anime({
                targets: notification,
                translateY: [-20, 0],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad',
                complete: () => {
                    setTimeout(() => {
                        anime({
                            targets: notification,
                            translateY: [0, -20],
                            opacity: [1, 0],
                            duration: 300,
                            easing: 'easeInQuad',
                            complete: () => {
                                if (document.body.contains(notification)) {
                                    document.body.removeChild(notification);
                                }
                            }
                        });
                    }, 2000);
                }
            });
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if (isCallActive) {
                switch(event.key) {
                    case 'm':
                    case 'ة':
                        toggleMute();
                        break;
                    case 's':
                    case 'س':
                        toggleSpeaker();
                        break;
                    case 'h':
                    case 'ه':
                        toggleHold();
                        break;
                    case 'Escape':
                        endCall();
                        break;
                    case 'v':
                    case 'ض':
                        showVolumeSlider();
                        break;
                }
            }
        });
        
        // Simulate call quality changes
        setInterval(() => {
            if (isCallActive && Math.random() < 0.1) { // 10% chance
                const qualities = ['ممتازة', 'جيدة', 'متوسطة'];
                const quality = qualities[Math.floor(Math.random() * qualities.length)];
                document.querySelector('.call-quality span').textContent = `جودة ${quality}`;
                
                // Change indicator color
                const indicator = document.querySelector('.quality-indicator');
                if (quality === 'ممتازة') {
                    indicator.style.background = '#10b981';
                } else if (quality === 'جيدة') {
                    indicator.style.background = '#f59e0b';
                } else {
                    indicator.style.background = '#ef4444';
                }
            }
        }, 5000);
    </script>
</body>
</html>
